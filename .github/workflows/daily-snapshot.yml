name: Daily regime-strategy snapshot

on:
  schedule:
    # 21:00 UTC daily, after the US market close. Re-pushed 2026-08-28 to
    # re-register the schedule trigger -- GitHub's cron scheduler had
    # gone silent (no run fired for the 08-27 21:00 UTC slot or the next
    # one after it, ~27h with zero scheduled runs despite the workflow
    # showing "active" and the file living on the default branch); a
    # fresh commit to this file is the standard workaround for that.
    - cron: "0 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # No explicit timeout previously meant GitHub's 360-minute (6h) default
    # applied. The tracking universe grew 273->415 tickers (1.5x) and the
    # strategy set grew 12->18 (1.5x) in the same session, roughly
    # doubling total backtest compute on top of an already ~2h13m baseline
    # run -- squarely at risk of hitting that 6h default and getting
    # silently killed with nothing committed. 600 minutes (10h) gives real
    # margin above even a generous estimate while still bounding a
    # genuinely hung run, rather than leaving it unbounded.
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run daily snapshot
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python -m smc_regime.daily_snapshot --intervals 1d,1h,1w,15m --start-date 2019-01-01 --rolling-intervals 15m

      # Grades were previously derived at export time and existed only
      # inside the published dashboard, so there was no way to ask what a
      # ticker scored last week or whether the A names went on to
      # outperform. This appends tonight's grades to a committed history --
      # its own step, not part of daily_snapshot, so a failure here is
      # visible on its own and leaves the snapshot and the published
      # database intact. See smc_regime/grade_report.py for reading it back.
      - name: Capture setup grades
        run: python -m smc_regime.capture_grades --interval 1d

      # Yahoo publishes only the UPCOMING report date and no source carries
      # historical ones, so the only way to get them is to write tonight's
      # down before it happens. Recorded on change rather than nightly, so
      # this stays a few thousand rows a year rather than 9 MB of unchanged
      # repetition. Its own step, like the grades: a failure here must not
      # take down the snapshot or the database it publishes.
      - name: Capture earnings dates
        run: python -m smc_regime.earnings_history --capture

      # backtest_logs/smc_regime.db is rewritten in full every run and
      # doesn't diff well as a git blob -- committing it directly would
      # grow repo history by ~one full copy per day and risks hitting
      # GitHub's 100MB per-file limit as more strategies/tickers get
      # added. Publish it as a release asset instead: no size limit that
      # matters here, no metered storage/bandwidth, and it never touches
      # git history. See smc_regime/fetch_db.py for the download side.
      - name: Publish SQLite snapshot to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view data-latest >/dev/null 2>&1; then
            gh release create data-latest \
              --title "Latest data snapshot" \
              --notes "Auto-updated nightly by the daily-snapshot workflow. Download smc_regime.db (python -m smc_regime.fetch_db) to get the current trade-level store -- this release is overwritten in place, not versioned history."
          fi
          gh release upload data-latest backtest_logs/smc_regime.db --clobber

      - name: Commit and push updated logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest_logs/regime_strategy_log.jsonl backtest_logs/setup_grade_history.jsonl backtest_logs/earnings_history.jsonl smc_regime/data/exchange_cache.json
          git diff --cached --quiet && exit 0

          git commit -m "Daily regime-strategy snapshot for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing onto latest remote..."
            git fetch origin "${GITHUB_REF_NAME}"

            # Two snapshot runs overlapping -- a dispatched one still
            # backtesting while the nightly one pushes -- both append to the
            # log after the same ancestor. That used to conflict on every
            # appended line, and since this step runs under `bash -e` the
            # failed rebase killed the push outright, silently dropping a
            # run's records. `merge=union` (.gitattributes) keeps both sides;
            # the normalize steps below then restore order and drop duplicates
            # in the snapshot log and the grade history alike.
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::rebase onto origin/${GITHUB_REF_NAME} conflicted outside the union-merged log; resolve by hand"
              exit 1
            fi
            python -m smc_regime.normalize_log
            python -m smc_regime.grade_history
            python -m smc_regime.earnings_history
            LOGS="backtest_logs/regime_strategy_log.jsonl backtest_logs/setup_grade_history.jsonl backtest_logs/earnings_history.jsonl"
            if ! git diff --quiet -- $LOGS; then
              git add $LOGS
              git commit --amend --no-edit
            fi
            sleep $((attempt * 5))
          done
          git push
