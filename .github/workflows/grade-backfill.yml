name: Backfill setup grades

# Manual only. The nightly workflow captures one day at a time going
# forward; this fills in the past, so it is run once for a range and then
# left alone. Re-running a range is safe -- grade_history dedupes on
# (date, interval, ticker) and the later write wins -- so a scoring fix can
# simply be replayed over the same dates.
on:
  workflow_dispatch:
    inputs:
      start:
        description: "First as-of date (YYYY-MM-DD)"
        required: true
      end:
        description: "Last as-of date (YYYY-MM-DD); defaults to start"
        required: false
        default: ""
      interval:
        description: "Which interval to grade"
        required: false
        default: "1d"
        type: choice
        options: ["1d", "1w"]

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    # ~16s per graded date at 415 tickers, plus one price fetch per ticker
    # up front. A full quarter is well under an hour; this bounds a hung
    # fetch without cutting a long range short.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Only for the ticker/sector/industry universe -- the grades
      # themselves are computed from freshly fetched price bars, not from
      # anything this database holds.
      - name: Fetch the ticker universe
        run: python -m smc_regime.fetch_db

      - name: Backfill grades
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: |
          python -m smc_regime.grade_backfill \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end || inputs.start }}" \
            --interval "${{ inputs.interval }}"

      - name: Commit and push the history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest_logs/setup_grade_history.jsonl
          git diff --cached --quiet && echo "no new grades" && exit 0

          git commit -m "Backfill ${{ inputs.interval }} setup grades ${{ inputs.start }}..${{ inputs.end || inputs.start }}"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing onto latest remote..."
            git fetch origin "${GITHUB_REF_NAME}"

            # The nightly capture appends to this same file, so a snapshot
            # run landing mid-backfill puts rows on both sides of the same
            # ancestor. `merge=union` (.gitattributes) keeps both; the
            # normalize below re-sorts and drops duplicates.
            if ! git rebase "origin/${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::rebase onto origin/${GITHUB_REF_NAME} conflicted outside the union-merged history; resolve by hand"
              exit 1
            fi
            python -m smc_regime.grade_history
            if ! git diff --quiet -- backtest_logs/setup_grade_history.jsonl; then
              git add backtest_logs/setup_grade_history.jsonl
              git commit --amend --no-edit
            fi
            sleep $((attempt * 5))
          done
          git push origin "HEAD:${GITHUB_REF_NAME}"
