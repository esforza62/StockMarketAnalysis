name: Daily regime-strategy snapshot

on:
  schedule:
    # 21:00 UTC daily, after the US market close
    - cron: "0 21 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run daily snapshot
        env:
          TIINGO_API_KEY: ${{ secrets.TIINGO_API_KEY }}
        run: python -m smc_regime.daily_snapshot --intervals 1d,1h --start-date 2019-01-01

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add backtest_logs/ smc_regime/data/exchange_cache.json
          git diff --cached --quiet && exit 0

          git commit -m "Daily regime-strategy snapshot for $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt), rebasing onto latest remote..."
            git fetch origin "${GITHUB_REF_NAME}"
            git rebase "origin/${GITHUB_REF_NAME}"
            sleep $((attempt * 5))
          done
          git push
